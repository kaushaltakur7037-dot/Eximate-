<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eximate - Job Application</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#eef4f3;color:#17302c;padding:16px}
  [hidden]{display:none!important}
  .ripple{position:absolute;border-radius:50%;transform:scale(0);animation:ripple .6s ease-out;pointer-events:none;background:rgba(255,255,255,.4)}
  @keyframes ripple{to{transform:scale(1);opacity:0}}
  @media(max-width:420px){#candidateRoot .two{grid-template-columns:1fr}}
  #candidateRoot .wrap{max-width:560px;margin:0 auto}
  #candidateRoot .head{background:#0b6e63;color:#fff;border-radius:16px 16px 0 0;padding:24px 20px}
  #candidateRoot .head h1{font-size:22px;margin-bottom:4px}
  #candidateRoot .head p{font-size:14px;opacity:.9}
  #candidateRoot form,#candidateRoot .done{background:#fff;border-radius:0 0 16px 16px;padding:20px;box-shadow:0 8px 30px rgba(11,110,99,.12)}
  #candidateRoot label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  #candidateRoot .opt{font-weight:400;color:#6b8580}
  #candidateRoot input,#candidateRoot select,#candidateRoot textarea{width:100%;padding:12px;border:1px solid #c9d8d5;border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:inherit}
  #candidateRoot textarea{min-height:90px;resize:vertical}
  #candidateRoot input:focus-visible,#candidateRoot select:focus-visible,#candidateRoot textarea:focus-visible,#candidateRoot button:focus-visible{outline:3px solid #2bb3a3;outline-offset:1px}
  #candidateRoot .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  #candidateRoot button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:10px;background:#0b6e63;color:#fff;font-size:16px;font-weight:700;cursor:pointer;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
  #candidateRoot button:disabled{opacity:.6}
  #candidateRoot #err{color:#c0392b;font-size:14px;margin-top:12px;min-height:18px}
  #candidateRoot .done{border-radius:16px;text-align:center;padding:36px 20px}
  #candidateRoot .done h2{margin-bottom:8px}
  #adminRoot .wrap{max-width:900px;margin:0 auto}
  #adminRoot header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  #adminRoot h1{font-size:22px}
  #adminRoot .count{color:#5d7a75;font-size:13px}
  #adminRoot button{padding:10px 16px;border:0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:#0b6e63;color:#fff;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
  #adminRoot button.ghost{background:#dde9e7;color:#17302c}
  #adminRoot button.danger{background:#c0392b}
  #adminRoot button:focus-visible,#adminRoot input:focus-visible,#adminRoot select:focus-visible{outline:3px solid #2bb3a3;outline-offset:2px}
  #adminRoot .ghost .ripple{background:rgba(0,0,0,.15)}
  #adminRoot .tabs{display:flex;gap:8px;margin-bottom:14px}
  #adminRoot .tabs button{background:#dde9e7;color:#17302c}
  #adminRoot .tabs button.on{background:#0b6e63;color:#fff}
  #adminRoot .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  #adminRoot .filters input{grid-column:1/-1}
  #adminRoot input,#adminRoot select{width:100%;padding:11px;border:1px solid #c9d8d5;border-radius:10px;font-size:15px;background:#fff;color:inherit}
  #adminRoot .box,#adminRoot .list{background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(11,110,99,.10)}
  #adminRoot .box{padding:22px;text-align:center}
  #adminRoot .list{overflow:hidden}
  #adminRoot .row{padding:13px 16px;border-bottom:1px solid #edf2f1;cursor:pointer}
  #adminRoot .row:last-child{border-bottom:0}
  #adminRoot .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
  #adminRoot .nm{font-weight:700}
  #adminRoot .sub{color:#5d7a75;font-size:13px;margin-top:2px}
  #adminRoot .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#dde9e7;flex:none}
  #adminRoot .s-New{background:#dbe8ff;color:#1d4ed8}
  #adminRoot .s-Shortlisted{background:#d9f2e3;color:#157347}
  #adminRoot .s-Interview{background:#fff0cc;color:#8a5a00}
  #adminRoot .s-Hired{background:#c7efe9;color:#0b6e63}
  #adminRoot .s-Rejected{background:#fde0dd;color:#b3261e}
  #adminRoot .detail{display:none;margin-top:12px;border-top:1px dashed #cfdedb;padding-top:12px}
  #adminRoot .row.open .detail{display:block}
  #adminRoot dl{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}
  #adminRoot dt{color:#5d7a75}
  #adminRoot dd{word-break:break-word}
  #adminRoot .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
  #adminRoot .actions select{width:auto}
  #adminRoot .actions a{padding:10px 14px;border-radius:10px;background:#dde9e7;color:#17302c;text-decoration:none;font-size:14px;font-weight:600}
  #adminRoot .av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#dfe4ef;flex:none}
  #adminRoot .urow{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid #edf2f1}
  #adminRoot .urow .info{flex:1;min-width:0}
  #adminRoot .urow .em{color:#5d7a75;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #adminRoot #msg{color:#c0392b;font-size:14px;margin-top:10px}
  #adminRoot .shareBox{background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:12px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 20px rgba(11,110,99,.10)}
  #adminRoot .shareBox input{flex:1;background:#f3f8f7}
</style>
</head>
<body>
<div id="candidateRoot">
<div class="wrap">
  <div id="formBox">
    <div class="head">
      <h1>Eximate - Join our team</h1>
      <p>Please fill in your details. Fields marked * are required.</p>
    </div>
    <form id="f" novalidate>
      <label for="name">Full name *</label>
      <input id="name" autocomplete="name" required>

      <div class="two">
        <div><label for="phone">Mobile number *</label><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" required></div>
        <div><label for="email">Email <span class="opt">(optional)</span></label><input id="email" type="email" autocomplete="email"></div>
      </div>

      <div class="two">
        <div><label for="dob">Date of birth</label><input id="dob" type="date"></div>
        <div><label for="gender">Gender</label>
          <select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
      </div>

      <div class="two">
        <div><label for="city">City *</label><input id="city" autocomplete="address-level2" required></div>
        <div><label for="state">State</label><input id="state" autocomplete="address-level1"></div>
      </div>

      <label for="post">Post applying for *</label>
      <select id="post" required>
        <option value="">Select post</option>
        <option>Medical Representative</option>
        <option>Area Sales Manager</option>
        <option>Sales Executive</option>
        <option>Pharmacist</option>
        <option>Lab Technician</option>
        <option>Accountant</option>
        <option>Office / Admin Staff</option>
        <option>Other</option>
      </select>

      <label for="qualification">Highest qualification *</label>
      <input id="qualification" placeholder="e.g. B.Pharm, B.Sc, MBA" required>

      <div class="two">
        <div><label for="exp">Experience (years)</label><input id="exp" type="number" min="0" max="60" step="0.5" inputmode="decimal"></div>
        <div><label for="join">Can join in</label>
          <select id="join"><option value="">Select</option><option>Immediately</option><option>15 days</option><option>1 month</option><option>2 months or more</option></select></div>
      </div>

      <label for="prev">Last / current company <span class="opt">(optional)</span></label>
      <input id="prev">

      <div class="two">
        <div><label for="curSal">Current salary <span class="opt">(per month)</span></label><input id="curSal" type="number" min="0" inputmode="numeric"></div>
        <div><label for="expSal">Expected salary <span class="opt">(per month)</span></label><input id="expSal" type="number" min="0" inputmode="numeric"></div>
      </div>

      <label for="resume">Resume link <span class="opt">(Google Drive / any link)</span></label>
      <input id="resume" type="url" placeholder="https://">

      <label for="msg">Anything else you want to tell us <span class="opt">(optional)</span></label>
      <textarea id="msg"></textarea>

      <div id="err" role="alert"></div>
      <button id="submitBtn" type="submit">Submit application</button>
    </form>
  </div>

  <div id="doneBox" class="done" hidden>
    <h2>Application received</h2>
    <p>Thank you. Our team will contact you if your profile matches.</p>
  </div>
</div>
</div>

<div id="adminRoot" hidden>
<div class="wrap">

  <div id="gate" class="box">
    <h1 style="margin-bottom:6px">Eximate Admin</h1>
    <p class="count" style="margin-bottom:16px">Sirf admin Google account se login kar sakta hai</p>
    <button id="loginBtn">Login with Google</button>
    <div id="adminMsg" role="alert"></div>
  </div>

  <div id="panel" hidden>
    <header>
      <div><h1>Eximate Admin</h1><div class="count" id="count"></div></div>
      <button id="logoutBtn" class="ghost">Logout</button>
    </header>

    <div class="tabs">
      <button id="tabApps" class="on">Applications</button>
      <button id="tabUsers">Users</button>
    </div>

    <div id="appsView">
      <div class="shareBox">
        <input id="shareLink" readonly aria-label="Form link">
        <button id="copyBtn" class="ghost">Copy form link</button>
      </div>
      <div class="filters">
        <input id="search" type="search" placeholder="Naam, phone, city ya post se dhundhein">
        <select id="fPost"><option value="">All posts</option></select>
        <select id="fStatus"><option value="">All status</option><option>New</option><option>Shortlisted</option><option>Interview</option><option>Hired</option><option>Rejected</option></select>
      </div>
      <div class="list" id="appList"></div>
    </div>

    <div id="usersView" hidden>
      <div class="list" id="userList"></div>
    </div>
  </div>
</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, getDocs, addDoc, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Yahan apna admin email likhein (Firestore rules mein bhi yehi email hona chahiye)
  const ADMIN_EMAIL = "kauahaltakur7037@gmail.com";

  const firebaseConfig = {
    apiKey: "AIzaSyBzb58CrudNBOao-4yHcZSj17QyACAYDiQ",
    authDomain: "eximate-login-2d69f.firebaseapp.com",
    projectId: "eximate-login-2d69f",
    storageBucket: "eximate-login-2d69f.firebasestorage.app",
    messagingSenderId: "665057062471",
    appId: "1:665057062471:web:b7379d37850e8dcc524b62",
    measurementId: "G-FEBNTQNX74"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const $ = id => document.getElementById(id);
  const STATUSES = ["New","Shortlisted","Interview","Hired","Rejected"];
  let apps = [], users = [], openId = null;

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = t => t?.toDate ? t.toDate().toLocaleString("en-IN", {dateStyle:"medium", timeStyle:"short"}) : "-";
  const provName = p => (p||"").includes("google") ? "Google" : (p||"").includes("facebook") ? "Facebook" : (p || "-");

  document.addEventListener("pointerdown", e => {
    const btn = e.target.closest("button"); if (!btn) return;
    const r = btn.getBoundingClientRect(), size = Math.max(r.width, r.height) * 2;
    const dot = document.createElement("span");
    dot.className = "ripple";
    dot.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size/2}px;top:${e.clientY - r.top - size/2}px`;
    btn.appendChild(dot); setTimeout(() => dot.remove(), 600);
  });

  // ---------- Applications ----------
  function renderApps(){
    const q = $("search").value.trim().toLowerCase(), fp = $("fPost").value, fs = $("fStatus").value;
    const shown = apps.filter(a =>
      (!fp || a.post === fp) && (!fs || (a.status||"New") === fs) &&
      [a.name,a.phone,a.city,a.post,a.email].join(" ").toLowerCase().includes(q));
    $("count").textContent = shown.length + " / " + apps.length + " applications";
    $("appList").innerHTML = shown.length ? shown.map(a => {
      const st = a.status || "New";
      const wa = "https://wa.me/" + (String(a.phone).length === 10 ? "91" : "") + a.phone;
      return `<div class="row ${openId===a.id?"open":""}" data-id="${a.id}">
        <div class="top"><div><div class="nm">${esc(a.name)}</div>
          <div class="sub">${esc(a.post)} • ${esc(a.city)} • ${esc(a.phone)}</div></div>
          <span class="tag s-${st}">${st}</span></div>
        <div class="detail">
          <dl>
            <dt>Applied on</dt><dd>${fmt(a.createdAt)}</dd>
            <dt>Mobile</dt><dd>${esc(a.phone)}</dd>
            <dt>Email</dt><dd>${esc(a.email)||"-"}</dd>
            <dt>Date of birth</dt><dd>${esc(a.dob)||"-"}</dd>
            <dt>Gender</dt><dd>${esc(a.gender)||"-"}</dd>
            <dt>City / State</dt><dd>${esc(a.city)}${a.state?", "+esc(a.state):""}</dd>
            <dt>Post</dt><dd>${esc(a.post)}</dd>
            <dt>Qualification</dt><dd>${esc(a.qualification)}</dd>
            <dt>Experience</dt><dd>${a.experience?esc(a.experience)+" years":"-"}</dd>
            <dt>Last company</dt><dd>${esc(a.prevCompany)||"-"}</dd>
            <dt>Current salary</dt><dd>${esc(a.currentSalary)||"-"}</dd>
            <dt>Expected salary</dt><dd>${esc(a.expectedSalary)||"-"}</dd>
            <dt>Can join in</dt><dd>${esc(a.joinIn)||"-"}</dd>
            <dt>Resume</dt><dd>${a.resume && /^https?:\/\//i.test(a.resume) ? `<a href="${esc(a.resume)}" target="_blank" rel="noopener">Open resume</a>` : "-"}</dd>
            <dt>Message</dt><dd>${esc(a.message)||"-"}</dd>
          </dl>
          <div class="actions">
            <select data-status="${a.id}" aria-label="Status">${STATUSES.map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}</select>
            <a href="tel:${esc(a.phone)}">Call</a>
            <a href="${wa}" target="_blank" rel="noopener">WhatsApp</a>
            <button class="danger" data-del="${a.id}">Delete</button>
          </div>
        </div></div>`;
    }).join("") : `<div class="row" style="text-align:center;color:#5d7a75;cursor:default">Koi application nahi mili</div>`;
  }

  $("appList").addEventListener("click", async e => {
    const delId = e.target.closest("[data-del]")?.dataset.del;
    if (delId) {
      if (confirm("Is application ko delete karna hai? Ye wapas nahi aayegi.")) {
        try { await deleteDoc(doc(db, "applications", delId)); apps = apps.filter(a => a.id !== delId); renderApps(); }
        catch (err) { alert("Delete nahi hua: " + (err.code || err.message)); }
      }
      return;
    }
    if (e.target.closest(".actions") || e.target.closest("a")) return;
    const row = e.target.closest(".row");
    if (row?.dataset.id) { openId = openId === row.dataset.id ? null : row.dataset.id; renderApps(); }
  });

  $("appList").addEventListener("change", async e => {
    const id = e.target.dataset.status; if (!id) return;
    try {
      await updateDoc(doc(db, "applications", id), { status: e.target.value });
      apps.find(a => a.id === id).status = e.target.value; renderApps();
    } catch (err) { alert("Status save nahi hua: " + (err.code || err.message)); }
  });

  async function loadApps(){
    try {
      const snap = await getDocs(collection(db, "applications"));
      apps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      apps.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
      const posts = [...new Set(apps.map(a => a.post).filter(Boolean))].sort();
      $("fPost").innerHTML = `<option value="">All posts</option>` + posts.map(p => `<option>${esc(p)}</option>`).join("");
      renderApps();
    } catch (e) {
      $("appList").innerHTML = `<div class="row" style="color:#c0392b;cursor:default">Applications load nahi hui: ${esc(e.code || e.message)}</div>`;
    }
  }

  // ---------- Users ----------
  function renderUsers(){
    $("count").textContent = users.length + " users";
    $("userList").innerHTML = users.length ? users.map(u => `
      <div class="urow">
        ${u.photo ? `<img class="av" src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer">` : `<div class="av"></div>`}
        <div class="info"><div class="nm">${esc(u.name)||"(no name)"}</div><div class="em">${esc(u.email)||"(no email)"}</div></div>
        <div style="text-align:right"><span class="tag">${provName(u.provider)}</span><div class="count">${fmt(u.lastLogin)}</div></div>
      </div>`).join("") : `<div class="row" style="text-align:center;color:#5d7a75;cursor:default">Koi user nahi mila</div>`;
  }
  async function loadUsers(){
    try {
      const snap = await getDocs(collection(db, "users"));
      users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      users.sort((a,b) => (b.lastLogin?.seconds||0) - (a.lastLogin?.seconds||0));
      renderUsers();
    } catch (e) {
      $("userList").innerHTML = `<div class="row" style="color:#c0392b;cursor:default">Users load nahi hue: ${esc(e.code || e.message)}</div>`;
    }
  }

  // ---------- Tabs / auth ----------
  function showTab(t){
    const apps_ = t === "apps";
    $("appsView").hidden = !apps_; $("usersView").hidden = apps_;
    $("tabApps").classList.toggle("on", apps_); $("tabUsers").classList.toggle("on", !apps_);
    apps_ ? renderApps() : (users.length ? renderUsers() : loadUsers());
  }
  $("tabApps").onclick = () => showTab("apps");
  $("tabUsers").onclick = () => showTab("users");
  $("search").oninput = renderApps; $("fPost").onchange = renderApps; $("fStatus").onchange = renderApps;

  $("shareLink").value = location.href.split("#")[0];
  $("copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText($("shareLink").value); $("copyBtn").textContent = "Copied"; }
    catch { $("shareLink").select(); }
    setTimeout(() => $("copyBtn").textContent = "Copy form link", 1500);
  };

  $("loginBtn").onclick = async () => {
    $("adminMsg").textContent = "";
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { $("adminMsg").textContent = "Login nahi hua: " + (e.code || e.message); }
  };
  $("logoutBtn").onclick = async () => { await signOut(auth); location.hash = ""; };

  let adminMode = false, currentUser = null;
  function refreshAdmin(){
    const isAdmin = currentUser && currentUser.email === ADMIN_EMAIL;
    $("gate").hidden = !!isAdmin; $("panel").hidden = !isAdmin;
    if (isAdmin && adminMode) loadApps();
  }
  function setAdminMode(on){
    adminMode = on;
    $("candidateRoot").hidden = on; $("adminRoot").hidden = !on;
    refreshAdmin();
  }
  onAuthStateChanged(auth, user => {
    currentUser = user;
    if (user && user.email !== ADMIN_EMAIL) {
      if (adminMode) $("adminMsg").textContent = "Ye account admin nahi hai.";
      signOut(auth); return;
    }
    refreshAdmin();
  });
  if (location.hash === "#admin") setAdminMode(true);
  window.addEventListener("hashchange", () => setAdminMode(location.hash === "#admin"));

  // Admin ka rasta: form ke heading par 5 baar jaldi tap karein (candidate ko koi button nahi dikhta)
  let taps = 0, tapTimer;
  document.querySelector("#candidateRoot .head h1").addEventListener("click", () => {
    taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 2500);
    if (taps >= 5) { taps = 0; location.hash = "#admin"; }
  });

  // ---------- Candidate form ----------
  const v = id => $(id).value.trim();
  const btn = $("submitBtn");

  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    $("err").textContent = "";
    const phone = v("phone").replace(/[\s\-+]/g, "");
    if (!v("name") || !phone || !v("city") || !v("post") || !v("qualification")) {
      $("err").textContent = "Please fill all required (*) fields."; return;
    }
    if (!/^\d{10,13}$/.test(phone)) { $("err").textContent = "Enter a valid mobile number."; return; }
    if (v("resume") && !/^https?:\/\//i.test(v("resume"))) { $("err").textContent = "Resume link must start with http:// or https://"; return; }

    btn.disabled = true; btn.textContent = "Submitting...";
    try {
      await addDoc(collection(db, "applications"), {
        name: v("name"), phone, email: v("email"), dob: v("dob"), gender: v("gender"),
        city: v("city"), state: v("state"), post: v("post"), qualification: v("qualification"),
        experience: v("exp"), joinIn: v("join"), prevCompany: v("prev"),
        currentSalary: v("curSal"), expectedSalary: v("expSal"),
        resume: v("resume"), message: v("msg"),
        status: "New", createdAt: serverTimestamp()
      });
      $("formBox").hidden = true; $("doneBox").hidden = false;
      window.scrollTo(0, 0);
    } catch (err) {
      $("err").textContent = "Could not submit. Please try again. (" + (err.code || err.message) + ")";
      btn.disabled = false; btn.textContent = "Submit application";
    }
  });
</script>
</body>
</html>
